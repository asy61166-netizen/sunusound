<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUNUSOUND – La musique qui nous rassemble</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- Barre latérale (devient barre de navigation en bas sur mobile) -->
<aside class="side">
  <div class="logo">SUNU<span>SOUND</span></div>
  <nav>
    <button data-page="home" class="on">🏠<b>Accueil</b></button>
    <button data-page="explore">🧭<b>Explorer</b></button>
    <button data-page="library">📚<b>Bibliothèque</b></button>
    <button data-page="playlists">🎶<b>Playlists</b></button>
  </nav>
  <p class="slogan">La musique qui nous rassemble.</p>
</aside>

<main>
  <header class="top"><input id="search" type="search" placeholder="Rechercher une chanson ou un artiste…"></header>
  <section id="page-home" class="page on"></section>
  <section id="page-explore" class="page"></section>
  <section id="page-library" class="page"></section>
  <section id="page-playlists" class="page"></section>
</main>

<!-- Lecteur audio fixe -->
<footer class="player">
  <div class="now">
    <div id="pCover" class="cv"></div>
    <div><b id="pTitle">Aucune lecture</b><small id="pArtist">Choisissez une chanson</small></div>
    <button id="pFav" title="Favori">♥</button>
  </div>
  <div class="ctrl">
    <div class="btns">
      <button id="prev" title="Précédent">⏮</button>
      <button id="play" class="big" title="Lecture / Pause">▶</button>
      <button id="next" title="Suivant">⏭</button>
      <button id="rep" title="Répéter">🔁</button>
    </div>
    <div class="bar"><span id="cur">0:00</span><input id="seek" type="range" min="0" max="100" value="0"><span id="dur">0:00</span></div>
  </div>
  <div class="vol">🔊<input id="vol" type="range" min="0" max="100" value="70"></div>
</footer>
<div id="toast"></div>

<script src="js/music.js"></script>
<script src="js/script.js"></script>
</body>
</html>
